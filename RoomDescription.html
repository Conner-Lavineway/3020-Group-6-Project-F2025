<!DOCTYPE html>
<html>
	<head>                
		<title>RoomDescription</title>
		<link rel="stylesheet" href="roomDescriptionStyle.css">
	</head>
	<body>

		<div>
			<div id="search-bar" style="border-bottom: 2px solid black">
				<div id="logo"></div>
				<input type="text" class="search" placeholder="Search...">

				<div id="events-dropdown">
					<button onclick="dropdown()" class="dropbutton">Events</button>
					<div id="events" class="dropdown-content">
					</div>
				</div>

				<div id="filter-dropdown">
					<button onclick="dropdown()" class="dropbutton">Filter</button>
					<div id="filter" class="dropdown-content">
					</div>
				</div>

				<div id="sort-dropdown">
					<button onclick="dropdown()" class="dropbutton">Sort</button>
					<div id="sort" class="dropdown-content">
					</div>
				</div>

			</div>
			<div class="headerContainer">
				<div>
					<button class="backButton" style="text-align:left; padding-left: 10%"><<</button>
				</div>
				<div>
					<h1 style="text-align:center">EITC 320</h1>
				</div>
				<div></div>

			</div>


			<div class="container">
				<div style="margin-left: 5%" class="schedule" id="schedule"></div>
				<div>

					<img src=".\classroom1.jfif" style="max-width: 100%; border-radius: 25px;">

					<div style="text-align: left" class="roundedBox">
						<h3 style="border-bottom: 1px solid #8c8c8c">Description</h3>
						<p> A small room situated in the left-wing of the EITC building. It has a projector, multiple chairs, and outlets.</p>
					</div>

				</div>
				<div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%">
					<div class="roundedBox">
						<div style="text-align: left; display: flex; border-bottom: 1px solid #8c8c8c">
							<p><b>Building:&nbsp;</b></p>
							<p>EITC</p>
						</div>
						<div style="text-align: left; display: flex; border-bottom: 1px solid #8c8c8c">
							<p><b>Room:&nbsp;</b></p>
							<p>320</p>
						</div>
						<div style="text-align: left; display: flex; border-bottom: 1px solid #8c8c8c">
							<p><b>Noise Level:&nbsp;</b></p>
							<p>Quiet</p>
						</div>
						<div style="text-align: left; border-bottom: 1px solid #8c8c8c">
							<p><b>Amenities:</b></p>
							<ul>
								<li>Projector</li>
								<li>Chairs</li>
								<li>Outlets</li>
							</ul>
						</div>
					</div>
					<div style="text-align: right">
						<button class="dibsButton">DIBS</button>
					</div>
				</div>
			</div>

		</div>

		<script src="Schedule.js"></script>

	</body>
</html>
