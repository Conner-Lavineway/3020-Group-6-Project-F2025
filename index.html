<!DOCTYPE html>
<html>
    <head>
        <!--Custom styles-->
        <link rel="stylesheet" href="homepage.css">


        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>
        <!-- Make sure you put this AFTER Leaflet's CSS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
         <!--Maptiler Stuff-->
        <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.umd.min.js"></script>
        <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.css" rel="stylesheet" />
        <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v4.1.0/leaflet-maptilersdk.umd.min.js"></script>
          
        <title>Map Test</title>
    </head>
    <body>
        <div id="search-bar">
            <div id="logo"></div>
            <input type="text" id="search" placeholder="Search...">
            
            <div id="events-dropdown">
                <button onclick="eventButton()" class="dropbutton">Events</button>
                <div id="events" class="dropdown-content">
                    <div class="event">
                        <div class="event-header">EITC 320: DnD Game</div>
                        <div class="event-details">1:30pm - 4:30pm</div>
                    </div>
                </div>
            </div>
            
            <div id="filter-dropdown">
                <button onclick="filterButton()" class="dropbutton">Filter</button>
                <div id="filters" class="dropdown-content">
                    <div class="filter">
                        <div class="filter-header">Amenites</div>
                        <div class="filter-details">
                            <button onclick="buttonFilter()" class="filterButton" id="outlets">Outlets</button>
                            <button onclick="buttonFilter()" class="filterButton" id="projectors">Projectors</button>
                        </div>
                    </div>
                    <div class="filter">
                        <div class="filter-header">Building</div>
                        <div class="filter-details">
                            <input type="checkbox" id="outlets" name="outlets" value="outlets">
                            <label for="outlets">Outlets</label>
                            <input type="checkbox" id="projectors" name="projectors" value="projectors">
                            <label for="projectors">Projectors</label>
                        </div>
                    </div>
                    <div class="filter">
                        <div class="filter-header">Available At:</div>
                        <div class="filter-details">
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="sort-dropdown">
                <button onclick="sortButton()" class="dropbutton">Sort</button>
                <div id="sorting" class="dropdown-content">
                    <button onclick="sortFilter()" class="sortButton" id="relevance">Relevance</button>
                    <button onclick="sortFilter()" class="sortButton" id="distance">Distance</button>
                </div>
            </div>
            
        </div>
            <div id="side-bar">
                
                <!--Both filled with widgets to show scrolling, need to autopopulate from data when we get that-->
                <div id="available-rooms">
                    <p>Available Rooms</p>
                    <div class="scroll-containter">
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                    </div>
                </div>
                <div id="occupied-rooms">
                    <p>Dibbed Rooms</p>
                    <div class="scroll-containter">
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                    </div>
                </div>
            </div>


            <div id="map"></div>    


        <!--Keep scripts at the bottom they need to be loaded after all the page elements-->
        <script src="map.js"></script>
        <script src="dropdown.js"></script>
    </body>
</html>
