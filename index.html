<!DOCTYPE html>
<html>
    <head>
        <!--Custom styles-->
        <link rel="stylesheet" href="./Assets/CSS/homepage.css">


        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>
        <!-- Make sure you put this AFTER Leaflet's CSS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
         <!--Maptiler Stuff-->
        <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.umd.min.js"></script>
        <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.css" rel="stylesheet" />
        <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v4.1.0/leaflet-maptilersdk.umd.min.js"></script>

     
        
    <title>Map Test</title>
    </head>
    <body>
        <div id="search-bar">
            <div id="logo"></div>
            <input type="text" id="search" placeholder="Search...">
            
            <div id="events-dropdown">
                <button onclick="showEvent()" class="dropbutton">Events</button>
                <div id="events" class="dropdown-box">
                    <div class="event dropdown-content">
                        <div class="event-header dropdown-content">EITC 320: DnD Game</div>
                        <div class="event-details dropdown-content">1:30pm - 4:30pm</div>
                    </div>
                </div>
            </div>
            
            <div id="filter-dropdown">
                <button onclick="showFilter()" class="dropbutton">Filter</button>
                <div id="filters" class="dropdown-box">
                    <div class="filter dropdown-content">
                        <!--
                        <div class="filter-header dropdown-content">Amenites:</div>
                        <div class="filter-details dropdown-content">
                            <button onclick="filterButton()" class="filterButton dropdown-content" id="outlet">Outlets</button>
                            <button onclick="filterButton()" class="filterButton dropdown-content" id="projector">Projector/TV</button>
                            <button onclick="filterButton()" class="filterButton dropdown-content" id="food">Food Allowed</button>
                            <button onclick="filterButton()" class="filterButton dropdown-content" id="whiteboard">Whiteboard</button>
                            <button onclick="filterButton()" class="filterButton dropdown-content" id="circle">Ritual Circle</button>
                        </div>
                        -->
                    </div>
                    <div class="filter dropdown-content">
                        <div class="filter-header dropdown-content">Building</div>
                        <div class="filter-details dropdown-content">
                            <select class="building dropdown-content">
                                <option class="dropdown-content" value="1">EITC</option>
                                <option class="dropdown-content" value="2">Drake Center</option>
                                <option class="dropdown-content" value="3">Isbister</option>
                                <option class="dropdown-content" value="4">University College</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter dropdown-content">
                        <div class="filter-header dropdown-content">Available At:</div>
                        <div class="filter-details dropdown-content">
                            <input type="time" id="time" min="09:00" max="18:00" step="900">

                        </div>
                    </div>
                </div>
            </div>
            
            <div id="sort-dropdown">
                <button onclick="showSort()" class="dropbutton">Sort</button>
                <div id="sorting" class="dropdown-box">
                    <button onclick="sortFilter()" class="sortButton dropdown-content" id="relevance">Relevance</button>
                    <button onclick="sortFilter()" class="sortButton dropdown-content" id="distance">Distance</button>
                </div>
            </div>
            
        </div>
            <div id="side-bar">
                
                <!--Both filled with widgets to show scrolling, need to autopopulate from data when we get that-->
                <div id="available-rooms">
                    <p>Available Rooms</p>
                    <div class="scroll-containter">
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                    </div>
                </div>
                <div id="occupied-rooms">
                    <p>Dibbed Rooms</p>
                    <div class="scroll-containter">
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                        <div class="test-widget"></div>
                    </div>
                </div>
            </div>


            <div id="map"></div>    


        <!--Keep scripts at the bottom they need to be loaded after all the page elements-->
        <script src="./Assets/JS/map.js"></script>
        <script src="./Assets/JS/dropdown.js"></script>
        <script src="./Assets/Data/Filters.js"></script>
        <script src="./Assets/JS/populate.js"></script>
    </body>
</html>
