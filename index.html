<!DOCTYPE html>
<html>
    <head>
        <!--Custom styles-->
        <link rel="stylesheet" href="./Assets/CSS/homepage.css">


        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>
        <!-- Make sure you put this AFTER Leaflet's CSS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
         <!--Maptiler Stuff-->
        <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.umd.min.js"></script>
        <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.css" rel="stylesheet" />
        <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v4.1.0/leaflet-maptilersdk.umd.min.js"></script>

     
        
    <title>Map room</title>
    </head>
    <body>
        <div id="search-bar">
            <div id="logo"></div>
            <input type="text" id="search" placeholder="Search...">
            
            <div id="events-dropdown">
                <button onclick="showEvent()" class="dropbutton">Events Today</button>
                <div id="events" class="dropdown-box"></div>
            </div>
            
            <div id="filter-dropdown">
                <button onclick="showFilter()" class="dropbutton">Filter</button>
                <div id="filters" class="dropdown-box">                    </div>
            </div>
            
            <div id="sort-dropdown">
                <button onclick="showSort()" class="dropbutton">Sort</button>
                <div id="sorting" class="dropdown-box">
                    <button onclick="sortFilter()" class="sortButton dropdown-content" id="relevance">Relevance</button>
                    <button onclick="sortFilter()" class="sortButton dropdown-content" id="distance">Distance</button>
                </div>
            </div>
            
        </div>
            <div id="side-bar">
                
                <!--Both filled with widgets to show scrolling, need to autopopulate from data when we get that-->
                <div id="available-rooms">
                    <p>Available Rooms</p>
                    <div class="scroll-container">
                        <div class="room-widget">
                            <div class="room-header">EITC 320<br>9:00am - 11:00am</div>
                            <div class="room-details">
                                <div class="room-tag">Ritual Circle</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="occupied-rooms">
                    <p>Dibbed Rooms</p>
                    <div class="scroll-container">
                        <div class="room-widget"></div>
                        <div class="room-widget"></div>
                        <div class="room-widget"></div>
                        <div class="room-widget"></div>
                    </div>
                </div>
            </div>


            <div id="map"></div>    


        <!--Keep scripts at the bottom they need to be loaded after all the page elements-->
        <script src="./Assets/JS/map.js"></script>
        <script src="./Assets/JS/dropdown.js"></script>
        <!--Load data-->
        <script src="./Assets/Data/Filters.js"></script>
        <script src="./Assets/Data/Events.js"></script>
        <script src="./Assets/Data/Dibs_Prototype_Data.js"></script>
        <!--Do stuff with it-->
        <script src="./Assets/JS/populate.js"></script>
    </body>
</html>
